name: release-candidate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints/dev.txt
      - run: python -m pip install --disable-pip-version-check -c constraints/dev.txt ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: python eval/analyze_full_463.py --check
      - run: python scripts/check_publication_boundary.py
      - run: git diff --check

  test-install:
    runs-on: ubuntu-latest
    env:
      WORDLE_RL_DATA_DIR: ${{ github.workspace }}/data
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        install-mode: ["editable", "regular"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints/dev.txt
      - name: Install candidate
        shell: bash
        run: |
          if [[ "${{ matrix.install-mode }}" == "editable" ]]; then
            python -m pip install --disable-pip-version-check -c constraints/dev.txt -e ".[dev]"
          else
            python -m pip install --disable-pip-version-check -c constraints/dev.txt ".[dev]"
          fi
      - run: python scripts/fetch_words.py
      - run: python -m pytest
      - run: python -I -c "import wordle_rl; assert wordle_rl.__version__ == '1.0.0rc1'"
      - run: python -m wordle_rl --help
      - run: wordle-rl --help

  build-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints/dev.txt
      - run: python -m pip install --disable-pip-version-check -c constraints/dev.txt build
      - run: python -m build
      - run: python scripts/check_publication_boundary.py dist
      - name: Smoke-test wheel from an isolated directory
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip install --disable-pip-version-check dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-venv/bin/python" -I -c "import wordle_rl; assert wordle_rl.__version__ == '1.0.0rc1'"
          "$RUNNER_TEMP/wheel-venv/bin/wordle-rl" --help
      - name: Smoke-test sdist from an isolated directory
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/sdist-venv"
          "$RUNNER_TEMP/sdist-venv/bin/python" -m pip install --disable-pip-version-check dist/*.tar.gz
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/sdist-venv/bin/python" -I -c "import wordle_rl; assert wordle_rl.__version__ == '1.0.0rc1'"
          "$RUNNER_TEMP/sdist-venv/bin/wordle-rl" --help
      - uses: actions/upload-artifact@v4
        with:
          name: wordle-rl-1.0.0rc1
          path: dist/*
          if-no-files-found: error
